name: Market Radar

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

concurrency:
  group: market-radar
  cancel-in-progress: false

jobs:
  radar:
    runs-on: ubuntu-latest

    steps:
      - name: Get code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install packages
        run: pip install requests feedparser google-genai yfinance

      - name: Run Market Radar
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python market_radar.py

      - name: Save radar memory
        run: |
          git config user.name "Market Radar Bot"
          git config user.email "market-radar-bot@users.noreply.github.com"

          if [ -f seen_stories.json ]; then
            git add seen_stories.json

            if ! git diff --cached --quiet; then
              git commit -m "Update radar memory"
              git push
            fi
          fi
